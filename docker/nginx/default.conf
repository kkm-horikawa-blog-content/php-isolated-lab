server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    # app を再作成してアドレスが変わっても、Docker DNS で引き直す。
    resolver 127.0.0.11 valid=5s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    # 初期画面の外部フォント読込みもブラウザ側で止め、ローカル資源のみ使う。
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        set $fpm_backend app:9000;
        fastcgi_pass $fpm_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
    }
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
