name: php-isolated-lab

services:
  nginx:
    # nginx 1.27 系の最終パッチを索引ダイジェストでも固定。
    image: nginx:1.27.5-bookworm@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./applications/laravel/public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      labnet:
        ipv4_address: ${LAB_PREFIX:?}.10

  app:
    image: php-isolated-lab-app:8.3.35-lab.1
    pull_policy: never
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    user: www-data
    env_file: ./applications/laravel/.env
    volumes:
      - ./applications/laravel/.env:/var/www/html/.env:ro
      - laravel_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = fsockopen('127.0.0.1', 9000); exit($$s ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [labnet]

  wordpress:
    image: php-isolated-lab-wordpress:6.8.3-php8.3-lab.1
    pull_policy: never
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    user: www-data
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wp_db
      WORDPRESS_DB_USER: ${WP_DB_USER:?}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/wp-admin/install.php"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      labnet:
        ipv4_address: ${LAB_PREFIX:?}.11

  db:
    # MySQL 8.0.39。
    image: mysql:8.0.39@sha256:ccb8f749bb5e59f9f8f03bf7282c7ef27a93a1814a24f0a8a926fb4e19b7fb97
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [labnet]

  redis:
    # Redis 7.4.2。requirepass と AOF 永続化は設定ファイルに集める。
    image: redis:7.4.2-bookworm@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    env_file: ./applications/laravel/.env
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [labnet]

  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      # Laravel の架空 SMTP 認証を平文の検証ネットワーク内で受ける。
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      labnet:
        ipv4_address: ${LAB_PREFIX:?}.12

  gateway:
    image: php-isolated-lab-gateway:1.27.5-lab.1
    pull_policy: never
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    entrypoint: ["/usr/local/bin/lab-gateway"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8025:8025"
    environment:
      LAB_NGINX_IP: ${LAB_PREFIX:?}.10
      LAB_WORDPRESS_IP: ${LAB_PREFIX:?}.11
      LAB_MAILPIT_IP: ${LAB_PREFIX:?}.12
    extra_hosts:
      - "nginx:${LAB_PREFIX:?}.10"
      - "wordpress:${LAB_PREFIX:?}.11"
      - "mailpit:${LAB_PREFIX:?}.12"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop: [ALL]
    # 起動時だけ通信規則を設定し、nginx 起動前に権限をすべて手放す。
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv4.ip_forward: "0"
    depends_on:
      nginx:
        condition: service_healthy
      wordpress:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/up"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [entrance, labnet]

networks:
  labnet:
    internal: true
    ipam:
      config:
        - subnet: ${LAB_PREFIX:?}.0/24
  entrance:
    # internal 上のサービスは直接公開できないため、中継だけをこの網へ繋ぐ。
    # 中継自身の外向き通信はコンテナ内の OUTPUT 規則で拒否する。
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  wordpress_data:
  laravel_storage:
  mailpit_data:
